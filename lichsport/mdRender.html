<script>
        const params = new URLSearchParams(window.location.search);
        const filePath = params.get('file');

        const container = document.getElementById('markdown-container');

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
        }

        if (filePath) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    // Insert raw markdown properly
                    container.innerHTML = escapeHTML(text);
                    // Trigger renderMarkdown() in case it was already loaded
                    if (typeof renderMarkdown === "function") {
                        renderMarkdown();
                    }
                })
                .catch(err => {
                    container.textContent = 'Error loading file: ' + err.message;
                });
        } else {
            container.textContent = 'No file specified.';
        }

</script>
    <script src="https://cdn.jsdelivr.net/gh/MarketingPipeline/Markdown-Tag/markdown-tag-GitHub.js"></script>
</body>
